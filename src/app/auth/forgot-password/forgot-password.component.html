<div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>AKLinks</h1>
        <p>Enter your email to reset your password</p>
      </div>
  
      <div class="auth-content">
        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="login-form">
          <h2>Forgot Password</h2>
  
          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              formControlName="email"
              placeholder="Enter your registered email"
              [class.error]="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched"
            />
  
            <div class="error-message" *ngIf="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched">
              Please enter a valid email address
            </div>
          </div>
  
          <div class="error-message" *ngIf="errorMessage" style="margin-bottom: 1rem;">
            {{ errorMessage }}
          </div>
  
          <button type="submit" class="signin-btn" [disabled]="forgotForm.invalid || isLoading">
            <span *ngIf="!isLoading">Send Reset Link</span>
            <span *ngIf="isLoading">Sending...</span>
          </button>
        </form>
  
        <div class="auth-footer">
          <p>
            Remember your password?
            <a routerLink="/auth/login">Back to Login</a>
          </p>
        </div>
      </div>
    </div>
  </div>
