<div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>AKLinks</h1>
        <p>Create your new password</p>
      </div>
  
      <div class="auth-content">
        <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="login-form">
          <h2>Reset Password</h2>
  
          <!-- New Password -->
          <div class="form-group">
            <label for="newPassword">New Password</label>
            <div class="password-input-wrapper">
              <input
                [type]="showPassword ? 'text' : 'password'"
                id="newPassword"
                formControlName="newPassword"
                placeholder="Enter new password"
                [class.error]="resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched"
              />
  
              <button
                type="button"
                class="password-toggle-btn"
                (click)="togglePasswordVisibility()"
              >
                {{ showPassword ? 'Hide' : 'Show' }}
              </button>
            </div>
  
            <div class="error-message" *ngIf="resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched">
              Password must be at least 6 characters
            </div>
          </div>
  
          <!-- Confirm Password -->
          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="confirmPassword"
              formControlName="confirmPassword"
              placeholder="Confirm new password"
              [class.error]="resetForm.errors?.['passwordMismatch'] && resetForm.get('confirmPassword')?.touched"
            />
  
            <div class="error-message" *ngIf="resetForm.errors?.['passwordMismatch'] && resetForm.get('confirmPassword')?.touched">
              Passwords do not match
            </div>
          </div>
  
          <div class="error-message" *ngIf="errorMessage" style="margin-bottom: 1rem;">
            {{ errorMessage }}
          </div>
  
          <button type="submit" class="signin-btn" [disabled]="resetForm.invalid || isLoading">
            <span *ngIf="!isLoading">Reset Password</span>
            <span *ngIf="isLoading">Resetting...</span>
          </button>
        </form>
  
        <div class="auth-footer">
          <p>
            Back to <a routerLink="/auth/login">Login</a>
          </p>
        </div>
      </div>
    </div>
  </div>
